[project]
name = "pantheon-workhub"
version = "0.1.0"
description = "Local-first HERMES task lifecycle vertical slice"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pantheon-workhub = "pantheon_workhub.cli:main"

# Explicitly package only the local Python engine. The sibling cloud/ folder
# contains the Cloudflare Worker, not an importable Python distribution.
[tool.setuptools]
packages = ["pantheon_workhub"]
