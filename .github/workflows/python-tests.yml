name: WorkHub Python tests

on:
  push:
    branches:
      - feat/cloud-local-parity-20261014
  pull_request:
    paths:
      - "pantheon_workhub/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure pip install works in multi-runtime repository
        run: python -m pip install .
      - name: Compile Python
        run: python -m compileall -q pantheon_workhub tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
