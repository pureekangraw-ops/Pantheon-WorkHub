name: PANTHEON Observatory Contract
on:
  pull_request:
    paths:
      - "cloudflare/staging/**"
      - "cloudflare/production/owner-bridge.mjs"
      - "cloudflare/production/owner-bridge.test.mjs"
      - ".github/workflows/observatory-pantheon-test.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/staging/**"
      - "cloudflare/production/owner-bridge.mjs"
      - "cloudflare/production/owner-bridge.test.mjs"
jobs:
  observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test cloudflare/staging/observatory.test.mjs
      - run: node --test cloudflare/production/owner-bridge.test.mjs
